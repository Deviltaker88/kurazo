<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>蔵書 Kurazō — la tua libreria manga</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Zen+Maru+Gothic:wght@400;500;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/0.1.1/tesseract.min.js"></script>
<style>
  :root{
    --sumi:#14120f;       /* ink black */
    --washi:#f3eee4;      /* paper */
    --washi-dim:#e8e1d2;
    --beni:#c4302b;       /* obi red */
    --beni-dark:#8f211d;
    --nezumi:#a9a297;     /* halftone grey */
    --ai:#33475b;         /* indigo accent */
    --kin:#c99a3e;        /* gold */
    --line:#14120f;
    --radius:2px;
    font-size:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--washi);
    color:var(--sumi);
    font-family:'Zen Maru Gothic', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  #app{max-width:640px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--washi);
    background-image:
      radial-gradient(var(--nezumi) 0.6px, transparent 0.6px);
    background-size:10px 10px;
    background-position:-4px -4px;
    border-left:1px solid var(--sumi);
    border-right:1px solid var(--sumi);
  }

  /* ---------- Masthead ---------- */
  .masthead{
    background:var(--sumi);
    color:var(--washi);
    padding:22px 20px 18px;
    position:relative;
    border-bottom:4px solid var(--beni);
  }
  .masthead .kicker{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--kin);
    display:block;
    margin-bottom:4px;
  }
  .masthead h1{
    font-family:'Zen Kaku Gothic New',sans-serif;
    font-weight:900;
    font-size:32px;
    line-height:1;
    margin:0;
    letter-spacing:0.01em;
  }
  .masthead h1 .jp{color:var(--beni);margin-right:10px;}
  .masthead p{margin:8px 0 0;font-size:13px;color:var(--washi-dim);opacity:0.85;}

  /* ---------- Tabs ---------- */
  .tabs{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    border-bottom:2px solid var(--sumi);
    background:var(--washi);
  }
  .tabs button{
    font-family:'Zen Kaku Gothic New',sans-serif;
    font-weight:700;
    font-size:11.5px;
    letter-spacing:0.02em;
    padding:12px 4px;
    background:transparent;
    border:none;
    border-right:1px solid var(--sumi);
    color:var(--sumi);
    cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:4px;
  }
  .tabs button:last-child{border-right:none;}
  .tabs button .tnum{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--nezumi);}
  .tabs button.active{background:var(--beni);color:var(--washi);}
  .tabs button.active .tnum{color:#f0c9c7;}

  main{flex:1;padding:16px;padding-bottom:60px;}

  /* ---------- Panels / cards shared ---------- */
  .panel{
    background:var(--washi);
    border:1.5px solid var(--sumi);
    box-shadow:3px 3px 0 var(--sumi);
    padding:14px;
    margin-bottom:16px;
  }
  .hint{font-size:12.5px;color:#5a564d;line-height:1.5;margin:0 0 10px;}
  .hint b{color:var(--sumi);}

  /* ---------- Camera ---------- */
  .camera-wrap{
    position:relative;
    border:2px solid var(--sumi);
    background:#000;
    aspect-ratio:3/4;
    overflow:hidden;
    box-shadow:4px 4px 0 var(--sumi);
  }
  .camera-wrap video{width:100%;height:100%;object-fit:cover;display:block;}
  .camera-wrap canvas{display:none;}
  .corner{position:absolute;width:22px;height:22px;border-color:var(--beni);border-style:solid;}
  .c-tl{top:10px;left:10px;border-width:3px 0 0 3px;}
  .c-tr{top:10px;right:10px;border-width:3px 3px 0 0;}
  .c-bl{bottom:10px;left:10px;border-width:0 0 3px 3px;}
  .c-br{bottom:10px;right:10px;border-width:0 3px 3px 0;}
  .guide-line{
    position:absolute;left:6%;right:6%;top:50%;height:2px;background:var(--beni);opacity:0.85;
  }
  .guide-line::before,.guide-line::after{
    content:'';position:absolute;top:-4px;width:2px;height:10px;background:var(--beni);
  }
  .guide-line::before{left:0;}
  .guide-line::after{right:0;}
  .camera-caption{
    position:absolute;bottom:0;left:0;right:0;
    background:rgba(20,18,15,0.72);
    color:var(--washi);
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    padding:6px 10px;
    text-align:center;
  }
  .cam-actions{display:flex;gap:10px;margin-top:12px;}
  .cam-placeholder{
    height:100%;display:flex;align-items:center;justify-content:center;
    color:var(--nezumi);font-size:13px;text-align:center;padding:20px;
  }

  /* ---------- Buttons ---------- */
  .btn{
    font-family:'Zen Kaku Gothic New',sans-serif;
    font-weight:700;
    font-size:14px;
    border:1.5px solid var(--sumi);
    background:var(--washi);
    color:var(--sumi);
    padding:11px 16px;
    cursor:pointer;
    box-shadow:2px 2px 0 var(--sumi);
    flex:1;
  }
  .btn:active{transform:translate(2px,2px);box-shadow:none;}
  .btn.primary{background:var(--beni);color:var(--washi);border-color:var(--beni-dark);box-shadow:2px 2px 0 var(--beni-dark);}
  .btn.ghost{box-shadow:none;background:transparent;}
  .btn:disabled{opacity:0.4;cursor:not-allowed;}
  .btn.small{flex:none;padding:7px 10px;font-size:12px;}

  /* ---------- Forms ---------- */
  label{display:block;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.08em;text-transform:uppercase;color:var(--ai);margin:12px 0 4px;}
  input[type=text],input[type=number]{
    width:100%;
    border:1.5px solid var(--sumi);
    background:#fff;
    padding:10px;
    font-size:15px;
    font-family:'Zen Maru Gothic',sans-serif;
    color:var(--sumi);
  }
  input:focus{outline:2px solid var(--ai);outline-offset:1px;}

  .status-line{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    padding:8px 10px;
    border:1px dashed var(--nezumi);
    color:#5a564d;
    margin-top:10px;
  }
  .status-line.ok{border-color:var(--beni);color:var(--beni-dark);}
  .status-line.err{border-color:var(--beni-dark);color:var(--beni-dark);background:#fbeceb;}

  /* candidate results */
  .cand{
    display:flex;gap:10px;align-items:center;
    border:1px solid var(--sumi);padding:8px;margin-top:8px;cursor:pointer;background:#fff;
  }
  .cand:hover{background:var(--washi-dim);}
  .cand img{width:42px;height:60px;object-fit:cover;border:1px solid var(--sumi);flex-shrink:0;background:var(--nezumi);}
  .cand .ci{flex:1;min-width:0;}
  .cand .ci .t{font-weight:700;font-size:13.5px;line-height:1.25;}
  .cand .ci .m{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#6b675e;margin-top:2px;}

  /* ---------- Library ---------- */
  .lib-search{margin-bottom:14px;}
  .empty-state{
    text-align:center;padding:40px 16px;color:#6b675e;
  }
  .empty-state .es-icon{font-size:34px;margin-bottom:8px;}
  .series-card{background:#fff;border:1.5px solid var(--sumi);box-shadow:3px 3px 0 var(--sumi);margin-bottom:14px;}
  .series-head{display:flex;gap:10px;padding:12px;cursor:pointer;align-items:center;}
  .series-head img{width:44px;height:62px;object-fit:cover;border:1px solid var(--sumi);flex-shrink:0;background:var(--nezumi);}
  .series-head .sh-info{flex:1;min-width:0;}
  .series-head .sh-title{font-weight:700;font-size:14.5px;line-height:1.25;}
  .series-head .sh-sub{font-family:'JetBrains Mono',monospace;font-size:11px;color:#6b675e;margin-top:3px;}
  .pub-badge{
    display:inline-block;
    font-family:'JetBrains Mono',monospace;
    font-size:9.5px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    background:var(--ai);
    color:var(--washi);
    padding:2px 5px;
    margin-right:6px;
    border-radius:2px;
    vertical-align:middle;
  }
  .ocr-preview{margin-top:8px;border:1.5px dashed var(--nezumi);padding:6px;}
  .ocr-preview img{display:block;max-width:100%;image-rendering:pixelated;margin:0 auto;}
  .ocr-preview .ocr-preview-label{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:#8a8578;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px;}
  .progress-bar{height:5px;background:var(--washi-dim);margin-top:6px;position:relative;border:1px solid var(--sumi);}
  .progress-bar i{position:absolute;top:0;left:0;bottom:0;background:var(--beni);}
  .series-body{border-top:1px solid var(--sumi);padding:12px;background:var(--washi);}
  .vol-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;}
  .vol-slot{
    aspect-ratio:2/3;
    border:1.5px solid var(--sumi);
    display:flex;align-items:center;justify-content:center;
    font-family:'JetBrains Mono',monospace;font-weight:700;font-size:12px;
    cursor:pointer;position:relative;user-select:none;
  }
  .vol-slot.owned{background:var(--sumi);color:var(--washi);}
  .vol-slot.missing{
    background-image:radial-gradient(var(--nezumi) 1px, transparent 1px);
    background-size:5px 5px;
    background-color:#fff;
    color:#8a8578;
    border-style:dashed;
  }
  .stamp{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:var(--beni);font-size:9px;font-weight:900;border:2px solid var(--beni);border-radius:50%;
    background:rgba(255,255,255,0.0);
    opacity:0;transform:scale(1.6) rotate(-14deg);
    pointer-events:none;
  }
  .vol-slot.owned.stamped .stamp{animation:stampin 0.32s ease-out forwards;}
  @keyframes stampin{to{opacity:1;transform:scale(1) rotate(-14deg);}}
  .series-actions{display:flex;gap:8px;margin-top:12px;}
  .set-total-row{display:flex;gap:8px;align-items:center;margin-bottom:10px;}
  .set-total-row input{width:70px;}

  .sh-cover{cursor:pointer;position:relative;}
  .sh-cover::after{
    content:'☰';
    position:absolute;bottom:-1px;right:-1px;
    background:var(--sumi);color:var(--washi);
    font-size:9px;line-height:1;padding:2px 3px;
    border:1px solid var(--washi);
  }

  /* ---------- Tenda (storico volumi) ---------- */
  .tenda-overlay{
    position:fixed;inset:0;z-index:1000;
    background:rgba(20,18,15,0.55);
    display:flex;align-items:flex-start;justify-content:center;
  }
  .tenda-panel{
    background:var(--washi);
    width:100%;max-width:640px;max-height:82vh;
    overflow-y:auto;
    border-bottom:2px solid var(--sumi);
    box-shadow:0 6px 0 var(--sumi);
    padding:16px;
    transform:translateY(-100%);
    animation:tenda-drop 0.26s cubic-bezier(.2,.8,.3,1) forwards;
  }
  @keyframes tenda-drop{ to{ transform:translateY(0); } }
  .tenda-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:10px;border-bottom:2px solid var(--sumi);}
  .tenda-head img{width:40px;height:56px;object-fit:cover;border:1px solid var(--sumi);flex-shrink:0;}
  .tenda-head .th-title{font-weight:700;font-size:15px;flex:1;line-height:1.25;}
  .tenda-close{border:1.5px solid var(--sumi);background:var(--washi);color:var(--sumi);cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:11px;padding:7px 10px;box-shadow:2px 2px 0 var(--sumi);flex-shrink:0;}
  .tenda-close:active{transform:translate(2px,2px);box-shadow:none;}
  .log-entry{display:flex;align-items:center;gap:10px;border:1px solid var(--sumi);background:#fff;padding:8px 10px;margin-bottom:6px;}
  .log-entry .le-vol{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px;background:var(--sumi);color:var(--washi);min-width:30px;text-align:center;padding:5px 0;flex-shrink:0;}
  .log-entry .le-info{flex:1;min-width:0;}
  .log-entry .le-date{font-family:'JetBrains Mono',monospace;font-size:11px;color:#6b675e;}
  .le-source{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:0.04em;background:var(--ai);color:var(--washi);padding:2px 5px;border-radius:2px;margin-left:6px;vertical-align:middle;}
  .log-empty{text-align:center;padding:22px 10px;color:#6b675e;font-size:13px;line-height:1.5;}

  footer.note{padding:14px 16px 30px;font-size:11px;color:#8a8578;line-height:1.6;text-align:center;}
</style>
</head>
<body>
<div id="app">

  <div class="masthead">
    <span class="kicker">manga library scanner</span>
    <h1><span class="jp">蔵書</span>KURAZŌ</h1>
    <p>Inquadra il dorso o il codice a barre: teniamo il conto di cosa hai e cosa ti manca.</p>
  </div>

  <nav class="tabs">
    <button data-view="library" class="active"><span>Scaffale</span><span class="tnum" id="tab-count">0 serie</span></button>
    <button data-view="ocr"><span>Scansiona dorso</span><span class="tnum">OCR</span></button>
    <button data-view="barcode"><span>Scansiona ISBN</span><span class="tnum">barcode</span></button>
    <button data-view="manual"><span>Aggiungi</span><span class="tnum">manuale</span></button>
  </nav>

  <main id="view-root"></main>

  <footer class="note">Dati salvati solo su questo dispositivo/account · Riconoscimento testo e serie sono automatici ma sempre da confermare prima di salvare.</footer>
</div>

<script>
(function(){

/* ===================== STORAGE ===================== */
async function loadLibrary(){
  try{
    const res = await window.storage.get('library', false);
    if(res && res.value) return JSON.parse(res.value);
  }catch(e){ /* key not found yet */ }
  return {};
}
async function saveLibrary(lib){
  try{ await window.storage.set('library', JSON.stringify(lib), false); }
  catch(e){ console.error('storage error', e); }
}

let LIB = {}; // { [seriesKey]: {title, publisher, cover, total, owned:[nums], source} }

/* ===================== EDITORI (disambiguazione edizioni) ===================== */
const PUBLISHERS = [
  {name:'Star Comics', patterns:[/star\s*comics/i]},
  {name:'Panini Comics', patterns:[/panini\s*comics/i, /planet\s*manga/i, /\bpanini\b/i]},
  {name:'J-POP Manga', patterns:[/j[\-\s]?pop\s*manga/i, /\bj[\-\s]?pop\b/i, /edizioni\s*bd/i]},
  {name:'Kappa Edizioni', patterns:[/kappa\s*edizioni/i, /kappa\s*magazine/i, /kappa\s*boys/i]},
  {name:'Dynit Manga', patterns:[/dynit/i]},
  {name:'GOEN', patterns:[/\bgoen\b/i]},
  {name:'RW Edizioni', patterns:[/rw\s*edizioni/i, /rw\s*goen/i, /rw\s*lion/i]},
  {name:'Bao Publishing', patterns:[/bao\s*publishing/i]},
  {name:'Magic Press', patterns:[/magic\s*press/i]},
  {name:'Saldapress', patterns:[/saldapress/i]},
  {name:'Flashbook', patterns:[/flashbook/i]},
  {name:'Ronin Manga', patterns:[/ronin\s*manga/i]},
  {name:'Coconino Press', patterns:[/coconino/i]},
  {name:'Shockdom', patterns:[/shockdom/i]},
  {name:'Renbooks', patterns:[/renbooks/i]},
  {name:'Hazard Edizioni', patterns:[/hazard\s*edizioni/i]},
];
function detectPublisher(text){
  if(!text) return null;
  for(const p of PUBLISHERS){
    for(const re of p.patterns){
      if(re.test(text)) return p.name;
    }
  }
  return null;
}
function normalizePublisherLabel(raw){
  if(!raw) return null;
  const detected = detectPublisher(raw);
  return detected || raw.trim();
}

/* ===================== HELPERS ===================== */
function seriesKeyFromTitle(t, publisher){
  const base = t.toLowerCase().normalize('NFKD').replace(/[^\w]+/g,'').slice(0,60) || ('s'+Date.now());
  if(publisher){
    const pub = publisher.toLowerCase().normalize('NFKD').replace(/[^\w]+/g,'').slice(0,24);
    if(pub) return base + '__' + pub;
  }
  return base;
}
function extractVolumeNumber(text){
  if(!text) return null;
  const patterns = [
    /vol(?:ume)?\.?\s*(\d{1,3})/i,
    /n[°.]?\s*(\d{1,3})/i,
    /#\s*(\d{1,3})/,
    /\b(\d{1,3})\b(?!.*\b\d{1,3}\b)/ // last standalone number in string
  ];
  for(const p of patterns){
    const m = text.match(p);
    if(m) return parseInt(m[1],10);
  }
  return null;
}
function guessTitleFromOcr(rawText){
  if(!rawText) return '';
  const lines = rawText.split('\n').map(l=>l.trim()).filter(l=>l.length>1);
  if(!lines.length) return '';
  // strip volume-only lines, pick the longest remaining line as title guess
  const candidates = lines.filter(l=>!/^vol(?:ume)?\.?\s*\d{1,3}$/i.test(l) && !/^\d{1,3}$/.test(l));
  const pool = candidates.length? candidates : lines;
  pool.sort((a,b)=>b.length-a.length);
  return pool[0];
}
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ===================== ANILIST SEARCH ===================== */
async function searchAniList(query){
  const gql = `query ($search: String) {
    Page(perPage: 6) {
      media(search: $search, type: MANGA, sort: SEARCH_MATCH) {
        id
        title { romaji english native }
        volumes
        coverImage { medium }
        startDate { year }
        format
      }
    }
  }`;
  try{
    const r = await fetch('https://graphql.anilist.co', {
      method:'POST',
      headers:{'Content-Type':'application/json','Accept':'application/json'},
      body: JSON.stringify({query: gql, variables:{search: query}})
    });
    if(!r.ok) throw new Error('AniList HTTP '+r.status);
    const data = await r.json();
    return (data && data.data && data.data.Page && data.data.Page.media) || [];
  }catch(e){
    console.error('AniList search failed', e);
    return null; // signal failure vs empty
  }
}

/* ===================== GOOGLE BOOKS (ISBN) ===================== */
async function lookupIsbn(isbn){
  try{
    const r = await fetch('https://www.googleapis.com/books/v1/volumes?q=isbn:'+encodeURIComponent(isbn));
    if(!r.ok) throw new Error('GoogleBooks HTTP '+r.status);
    const data = await r.json();
    if(!data.items || !data.items.length) return null;
    const info = data.items[0].volumeInfo;
    return {
      title: info.title + (info.subtitle? ' '+info.subtitle : ''),
      thumb: info.imageLinks && (info.imageLinks.thumbnail || info.imageLinks.smallThumbnail),
      isbn,
      publisher: normalizePublisherLabel(info.publisher || null)
    };
  }catch(e){
    console.error('ISBN lookup failed', e);
    return null;
  }
}

/* ===================== LIBRARY MUTATIONS ===================== */
async function addVolumeToLibrary({seriesTitle, coverImage, totalVolumes, volumeNumber, publisher, source}){
  const pub = publisher? normalizePublisherLabel(publisher) : null;
  const key = seriesKeyFromTitle(seriesTitle, pub);
  if(!LIB[key]){
    LIB[key] = { title: seriesTitle, publisher: pub, cover: coverImage||null, total: totalVolumes||null, owned: [], log: [] };
  }
  if(!LIB[key].log) LIB[key].log = [];
  if(pub && !LIB[key].publisher) LIB[key].publisher = pub;
  if(coverImage && !LIB[key].cover) LIB[key].cover = coverImage;
  if(totalVolumes && !LIB[key].total) LIB[key].total = totalVolumes;
  if(volumeNumber){
    if(!LIB[key].owned.includes(volumeNumber)){
      LIB[key].owned.push(volumeNumber);
      LIB[key].owned.sort((a,b)=>a-b);
    }
    // registra ogni scansione/aggiunta nello storico, anche se il volume era già posseduto
    LIB[key].log.push({num: volumeNumber, date: Date.now(), source: source || 'manuale'});
    LIB[key].log.sort((a,b)=>b.date-a.date);
  }
  await saveLibrary(LIB);
  return key;
}

/* ===================== NUMERO TOTALE VOLUMI (auto-completamento) ===================== */
// AniList spesso non conosce il totale volumi (specie per serie ancora in corso o non
// popolarissime in occidente). Come ripiego automatico interroghiamo Jikan (API non
// ufficiale di MyAnimeList), che per molte serie riporta il numero di volumi pubblicati.
async function fetchTotalVolumesFallback(title){
  try{
    const r = await fetch('https://api.jikan.moe/v4/manga?q='+encodeURIComponent(title)+'&limit=3');
    if(!r.ok) throw new Error('Jikan HTTP '+r.status);
    const data = await r.json();
    const items = (data && data.data) || [];
    for(const item of items){
      if(item && item.volumes) return item.volumes;
    }
    return null;
  }catch(e){
    console.error('Ricerca automatica volumi totali (Jikan) fallita', e);
    return null;
  }
}
// Se il totale volumi non è ancora noto per una serie, prova a scoprirlo automaticamente
// e salva il risultato in libreria. Ritorna il totale (nuovo o già esistente) oppure null.
async function ensureTotalVolumes(key){
  const s = LIB[key];
  if(!s) return null;
  if(s.total) return s.total;
  const fetched = await fetchTotalVolumesFallback(s.title);
  if(fetched && LIB[key] && !LIB[key].total){
    LIB[key].total = fetched;
    await saveLibrary(LIB);
  }
  return LIB[key] ? LIB[key].total : null;
}
function sourceLabel(src){
  if(src==='ocr') return 'dorso';
  if(src==='barcode') return 'isbn';
  return 'manuale';
}
function formatLogDate(ts){
  try{
    return new Date(ts).toLocaleString('it-IT', {day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
  }catch(e){ return ''; }
}
function openVolumeLog(key){
  const s = LIB[key];
  if(!s) return;
  const overlay = document.createElement('div');
  overlay.className = 'tenda-overlay';
  const entries = (s.log && s.log.length) ? s.log.slice().sort((a,b)=>b.date-a.date) : null;
  let bodyHtml;
  if(entries && entries.length){
    bodyHtml = entries.map(e=>`
      <div class="log-entry">
        <div class="le-vol">${e.num}</div>
        <div class="le-info">
          <div class="le-date">${formatLogDate(e.date)}<span class="le-source">${sourceLabel(e.source)}</span></div>
        </div>
      </div>`).join('');
  } else if(s.owned && s.owned.length){
    bodyHtml = `<div class="log-empty">Nessuno storico dettagliato per questi volumi (aggiunti prima di questo aggiornamento).<br><b>Volumi presenti:</b> ${s.owned.join(', ')}</div>`;
  } else {
    bodyHtml = `<div class="log-empty">Nessun volume ancora registrato per questa serie.</div>`;
  }
  overlay.innerHTML = `
    <div class="tenda-panel">
      <div class="tenda-head">
        ${s.cover? `<img src="${s.cover}" alt="">` : ''}
        <div class="th-title">${escapeHtml(s.title)}</div>
        <button class="tenda-close" id="tenda-close">Chiudi ✕</button>

  document.body.appendChild(overlay);
  overlay.querySelector('#tenda-close').addEventListener('click', ()=>{
    if(overlay.parentNode) document.body.removeChild(overlay);
  });
}

function renderSeriesBody(container, key){
  const s = LIB[key];
  container.innerHTML = '';
  if(!s.publisher){
    const prow = document.createElement('div');
    prow.className = 'set-total-row';
    prow.innerHTML = `<label style="margin:0;">Editore</label><input type="text" placeholder="es. Star Comics" id="pub-${key}" style="width:auto;flex:1;"><button class="btn small">Imposta</button>`;
    prow.querySelector('button').addEventListener('click', async ()=>{
      const v = prow.querySelector('input').value.trim();
      if(v){ s.publisher = normalizePublisherLabel(v); await saveLibrary(LIB); renderSeriesBody(container,key); renderLibrary(); }
    });
    container.appendChild(prow);
  }
  if(!s.total){
    // Appena si apre la serie, se non conosciamo ancora il totale dei volumi usciti
    // proviamo subito a scoprirlo in automatico, così compaiono tutti i numeri senza
    // bisogno di inserirlo a mano.
    const fetchStatus = document.createElement('div');
    fetchStatus.className = 'status-line';
    fetchStatus.textContent = 'Cerco il numero totale di volumi pubblicati…';
    container.appendChild(fetchStatus);
    ensureTotalVolumes(key).then(total=>{
      if(!document.body.contains(container)) return; // la serie è stata richiusa/rimossa nel frattempo
      if(total){
        renderSeriesBody(container, key);
        renderLibrary();
      } else {
        fetchStatus.className = 'status-line err';
        fetchStatus.textContent = 'Non sono riuscito a trovare in automatico il numero totale di volumi. Impostalo qui sotto.';
        appendManualTotalRow(container, key);
      }
    });
  }
  const grid = document.createElement('div');
  grid.className = 'vol-grid';
  const maxShow = s.total || Math.max(...s.owned, 0);
  for(let i=1;i<=maxShow;i++){
    const owned = s.owned.includes(i);
    const slot = document.createElement('div');
    slot.className = 'vol-slot ' + (owned?'owned':'missing');
    slot.innerHTML = `${i}${owned? '<span class="stamp">OK</span>':''}`;
    slot.addEventListener('click', async ()=>{
      const idx = s.owned.indexOf(i);
      if(idx>=0){ s.owned.splice(idx,1); }
      else{
        s.owned.push(i); s.owned.sort((a,b)=>a-b);
        if(!s.log) s.log = [];
        s.log.push({num:i, date:Date.now(), source:'manuale'});
        s.log.sort((a,b)=>b.date-a.date);
      }
      await saveLibrary(LIB);
      renderSeriesBody(container,key);
      renderLibrary();
    });
    grid.appendChild(slot);
  }
  container.appendChild(grid);
  if(s.owned.some(n=>n>0)){
    setTimeout(()=>{
      container.querySelectorAll('.vol-slot.owned').forEach(el=>el.classList.add('stamped'));
    },10);
  }
  const actions = document.createElement('div');
  actions.className = 'series-actions';
  actions.innerHTML = `<button class="btn ghost small" data-act="del">Rimuovi serie dallo scaffale</button>`;
  actions.querySelector('[data-act=del]').addEventListener('click', async ()=>{
    if(confirm('Rimuovere "'+s.title+'" e tutti i volumi registrati?')){
      delete LIB[key];
      await saveLibrary(LIB);
      renderLibrary();
    }
  });
  container.appendChild(actions);
}

/* ===================== RITAGLIO AREA DI INTERESSE (per OCR) ===================== */
// Ritaglia la banda attorno alla linea guida rossa (dove l'utente allinea il dorso/titolo)
// mappando le coordinate REALI del riquadro a schermo (misurate a runtime, non assunte)
// sui pixel del frame catturato, poi ingrandisce e migliora il contrasto per l'OCR.
function cropForOcr(sourceCanvas, containerAR){
  const vw = sourceCanvas.width, vh = sourceCanvas.height;
  if(!vw || !vh) return sourceCanvas;
  const videoAR = vw/vh;
  let displayedW, displayedH, offsetX, offsetY;
  if(videoAR > containerAR){
    // il video è "più largo" del riquadro: cover ritaglia ai lati, altezza intera visibile
    displayedH = vh;
    displayedW = vh*containerAR;
    offsetX = (vw-displayedW)/2;
    offsetY = 0;
  } else {
    // il video è "più alto" del riquadro: cover ritaglia sopra/sotto, larghezza intera visibile
    displayedW = vw;
    displayedH = vw/containerAR;
    offsetX = 0;
    offsetY = (vh-displayedH)/2;
  }
  // banda generosa attorno alla linea guida: tollera piccoli disallineamenti dell'inquadratura
  const bandFrac = 0.42;
  const yCenter = offsetY + displayedH*0.5;
  let cropH = displayedH*bandFrac;
  let cropY = yCenter - cropH/2;
  let cropX = offsetX + displayedW*0.03; // margine leggermente più ampio dei "tick" della linea guida
  let cropW = displayedW*0.94;

  cropX = Math.max(0, cropX);
  cropY = Math.max(0, cropY);
  cropW = Math.min(vw-cropX, cropW);
  cropH = Math.min(vh-cropY, cropH);
  if(cropW<=0 || cropH<=0) return sourceCanvas;

  const scale = 2.2; // ingrandimento per migliorare l'accuratezza su testo piccolo
  const out = document.createElement('canvas');
  out.width = Math.round(cropW*scale);
  out.height = Math.round(cropH*scale);
  const octx = out.getContext('2d');
  octx.imageSmoothingEnabled = true;
  octx.drawImage(sourceCanvas, cropX, cropY, cropW, cropH, 0, 0, out.width, out.height);
  enhanceContrastGrayscale(out, octx);
  return out;
}

// Scala di grigi + stiramento del contrasto: aiuta molto l'OCR su foto scattate con luce non ottimale.
function enhanceContrastGrayscale(canvasEl, ctx){
  try{
    const img = ctx.getImageData(0,0,canvasEl.width,canvasEl.height);
    const d = img.data;
    let min=255, max=0;
    for(let i=0;i<d.length;i+=4){
      const g = 0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
      d[i]=d[i+1]=d[i+2]=g;
      if(g<min) min=g;
      if(g>max) max=g;
    }
    const range = Math.max(1, max-min);
    for(let i=0;i<d.length;i+=4){
      const v = Math.max(0, Math.min(255, ((d[i]-min)/range)*255));
      d[i]=d[i+1]=d[i+2]=v;
    }
    ctx.putImageData(img,0,0);
  }catch(e){ /* se l'immagine non è leggibile (cross-origin ecc.) salta il preprocessing */ }
}

// Esegue l'OCR provando più combinazioni ritaglio/lingua in cascata, così un singolo passaggio
// che fallisce (lingua non supportata, ritaglio troppo stretto, testo mal posizionato) non fa
// fallire l'intera scansione: ogni tentativo ha ampie possibilità di successo indipendenti.
async function recognizeWithFallback(cropCanvas, fullCanvas, onAttempt){
  const attempts = [
    {canvas: cropCanvas, lang:'eng+ita', label:'ritaglio · eng+ita'},
    {canvas: cropCanvas, lang:'eng', label:'ritaglio · eng'},
    {canvas: fullCanvas, lang:'eng+ita', label:'immagine intera · eng+ita'},
    {canvas: fullCanvas, lang:'eng', label:'immagine intera · eng'}
  ];
  for(const a of attempts){
    if(onAttempt) onAttempt(a.label);
    try{
      if(!window.Tesseract) throw new Error('motore OCR non disponibile');
      const result = await new Promise((resolve,reject)=>{
        try{
          const job = Tesseract.recognize(a.canvas, {lang:a.lang});
          if(job && typeof job.then === 'function'){
            job.then(resolve).catch(reject);
          } else {
            reject(new Error('interfaccia OCR inattesa'));
          }
        }catch(e){ reject(e); }
      });
      const text = (result && result.text) || (result && result.data && result.data.text) || '';
      if(text.trim()){
        return {text, usedCanvas: a.canvas, usedLabel: a.label};
      }
    }catch(e){
      console.error('OCR attempt failed ('+a.label+')', e);
    }
  }
  return {text:'', usedCanvas: cropCanvas, usedLabel: null};
}

/* ===================== OCR VIEW ===================== */
function renderOcr(){
  root.innerHTML = `
    <div class="panel">
      <p class="hint"><b>Scansiona il dorso o la copertina.</b> Funziona meglio con testo latino ben illuminato (edizioni italiane/inglesi); allinea il titolo sulla linea rossa. Per titoli in kanji conviene la ricerca manuale.</p>
      <div class="camera-wrap" id="cam-wrap">
        <div class="cam-placeholder">Attivazione fotocamera…</div>
      </div>
      <div class="cam-actions">
        <button class="btn primary" id="btn-capture" disabled>Scatta e leggi</button>
      </div>
      <div id="ocr-status"></div>
      <div id="ocr-result"></div>
    </div>
  `;
  const camWrap = document.getElementById('cam-wrap');
  const statusEl = document.getElementById('ocr-status');
  const resultEl = document.getElementById('ocr-result');
  const captureBtn = document.getElementById('btn-capture');

  const video = document.createElement('video');
  video.setAttribute('playsinline','');
  video.muted = true;
  const canvas = document.createElement('canvas');

  startCamera(video).then(()=>{
    camWrap.innerHTML = '';
    camWrap.appendChild(video);
    const gl = document.createElement('div'); gl.className='guide-line'; camWrap.appendChild(gl);
    ['c-tl','c-tr','c-bl','c-br'].forEach(c=>{ const d=document.createElement('div'); d.className='corner '+c; camWrap.appendChild(d); });
    const cap = document.createElement('div'); cap.className='camera-caption'; cap.textContent='Allinea il dorso sulla linea rossa'; camWrap.appendChild(cap);
    camWrap.appendChild(canvas);
    captureBtn.disabled = false;
  }).catch(err=>{
    camWrap.innerHTML = `<div class="cam-placeholder">Impossibile accedere alla fotocamera.<br>${escapeHtml(err.message||'')}<br>Controlla i permessi del browser.</div>`;
  });

  captureBtn.addEventListener('click', async ()=>{
    captureBtn.disabled = true;
    statusEl.innerHTML = `<div class="status-line">Lettura del testo in corso…</div>`;
    resultEl.innerHTML = '';
    const w = video.videoWidth, h = video.videoHeight;
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video,0,0,w,h);

    // Misura il riquadro REALE a schermo (non un valore assunto) per mappare correttamente
    // la linea guida sui pixel del frame catturato, indipendentemente da come il browser
    // ha effettivamente applicato l'aspect-ratio CSS su questo dispositivo.
    const wrapRect = camWrap.getBoundingClientRect();
    const containerAR = (wrapRect.width && wrapRect.height) ? (wrapRect.width/wrapRect.height) : (3/4);

    // Ritaglia l'area attorno alla linea guida rossa prima di passarla all'OCR:
    // riduce il rumore (bordi, sfondo) e ingrandisce il testo del titolo, migliorando l'accuratezza.
    const ocrCanvas = cropForOcr(canvas, containerAR);

    const {text: ocrText, usedLabel} = await recognizeWithFallback(ocrCanvas, canvas, (label)=>{
      statusEl.innerHTML = `<div class="status-line">Lettura del testo in corso… (${escapeHtml(label)})</div>`;
    });
    const ocrFailed = !ocrText.trim();
    captureBtn.disabled = false;

    let previewHtml = '';
    try{
      previewHtml = `<div class="ocr-preview"><div class="ocr-preview-label">Area analizzata</div><img src="${ocrCanvas.toDataURL('image/jpeg',0.85)}" alt=""></div>`;
    }catch(e){ /* ignora se il canvas non è esportabile */ }

    if(ocrFailed){
      statusEl.innerHTML = `<div class="status-line err">Non sono riuscito a leggere testo utile dall'immagine. Correggi manualmente qui sotto.</div>${previewHtml}`;
    } else {
      statusEl.innerHTML = `<div class="status-line ok">Testo rilevato (${escapeHtml(usedLabel||'')}). Controlla e correggi prima di cercare la serie.</div>${previewHtml}`;
    }
    const guessedTitle = guessTitleFromOcr(ocrText);
    const guessedVol = extractVolumeNumber(ocrText);
    const guessedPublisher = detectPublisher(ocrText);
    showOcrConfirmForm(resultEl, guessedTitle, guessedVol, guessedPublisher);
  });
}

async function runSeriesSearch(candContainer, title, vol, publisher, source){
  candContainer.innerHTML = `<div class="status-line">Cerco "${escapeHtml(title)}" nel database manga…</div>`;
  const results = await searchAniList(title);
  if(results === null){
    candContainer.innerHTML = `
      <div class="status-line err">Ricerca serie non disponibile in questo momento.</div>
      <div class="cam-actions"><button class="btn primary" id="add-anyway">Aggiungi comunque "${escapeHtml(title)}" con questi dati</button></div>`;
    candContainer.querySelector('#add-anyway').addEventListener('click', async ()=>{
      const key = await addVolumeToLibrary({seriesTitle:title, volumeNumber:vol, publisher, source});
      confirmAdded(candContainer, title, vol, publisher);
      ensureTotalVolumes(key).then(()=> renderLibrary());
    });
    return;
  }
  if(!results.length){
    candContainer.innerHTML = `
      <div class="status-line">Nessuna corrispondenza trovata nel database.</div>
      <div class="cam-actions"><button class="btn primary" id="add-anyway">Aggiungi comunque "${escapeHtml(title)}"</button></div>`;
    candContainer.querySelector('#add-anyway').addEventListener('click', async ()=>{
      const key = await addVolumeToLibrary({seriesTitle:title, volumeNumber:vol, publisher, source});
      confirmAdded(candContainer, title, vol, publisher);
      ensureTotalVolumes(key).then(()=> renderLibrary());
    });
    return;
  }
  candContainer.innerHTML = `<div class="hint" style="margin:10px 0 0;">Seleziona la serie corretta:</div>`;
  results.forEach(m=>{
    const name = (m.title.romaji || m.title.english || m.title.native);
    const el = document.createElement('div');
    el.className = 'cand';
    el.innerHTML = `
      ${m.coverImage && m.coverImage.medium? `<img src="${m.coverImage.medium}">` : `<div style="width:42px;height:60px;background:var(--nezumi);border:1px solid var(--sumi);"></div>`}
      <div class="ci">
        <div class="t">${escapeHtml(name)}</div>
        <div class="m">${m.volumes? m.volumes+' volumi tot.':'tot. sconosciuto'}${m.startDate&&m.startDate.year? ' · '+m.startDate.year:''}</div>
      </div>`;
    el.addEventListener('click', async ()=>{
      const key = await addVolumeToLibrary({
        seriesTitle: name,
        coverImage: m.coverImage && m.coverImage.medium,
        totalVolumes: m.volumes || null,
        volumeNumber: vol,
        publisher,
        source
      });
      confirmAdded(candContainer, name, vol, publisher);
      if(!m.volumes) ensureTotalVolumes(key).then(()=> renderLibrary());
    });
    candContainer.appendChild(el);
  });
}

function confirmAdded(container, title, vol, publisher){
  renderLibrary(); // refresh badge count silently in background
  const pubBit = publisher? ` <span class="pub-badge">${escapeHtml(publisher)}</span>` : '';
  container.innerHTML = `<div class="status-line ok">✔ ${escapeHtml(title)}${vol? ' — vol. '+vol:''} aggiunto allo scaffale.${pubBit}</div>
    <div class="cam-actions"><button class="btn primary" id="scan-next">Scansiona il prossimo</button></div>`;
  container.querySelector('#scan-next').addEventListener('click', ()=> setView(currentView));
}

      type:'LiveStream',
      target: wrap,
      constraints:{ facingMode:{ideal:'environment'}, width:{ideal:1280}, height:{ideal:960} }
    },
    locator:{ patchSize:'medium', halfSample:true },
    numOfWorkers: navigator.hardwareConcurrency? Math.min(4,navigator.hardwareConcurrency):2,
    frequency: 10,
    decoder:{ readers:['ean_reader'] },
    locate:true
  }, function(err){
    started = true;
    clearTimeout(startTimeout);
    if(err){
      console.error(err);
      wrap.innerHTML = `<div class="cam-placeholder">Impossibile accedere alla fotocamera.<br>${escapeHtml((err&&err.message)||'')}<br>Controlla i permessi del browser per questo sito.</div>`;
      return;
    }
    Quagga.start();
    const v = wrap.querySelector('video');
    if(v){ v.style.width='100%'; v.style.height='100%'; v.style.objectFit='cover'; }
    const c = wrap.querySelector('canvas.drawingBuffer');
    if(c){ c.style.position='absolute'; c.style.top='0'; c.style.left='0'; c.style.width='100%'; c.style.height='100%'; }
    ['c-tl','c-tr','c-bl','c-br'].forEach(cc=>{ const d=document.createElement('div'); d.className='corner '+cc; wrap.appendChild(d); });
    const cap = document.createElement('div'); cap.className='camera-caption'; cap.textContent='In ricerca del codice a barre…'; wrap.appendChild(cap);
    statusEl.innerHTML = `<div class="status-line">Scansione attiva.</div>`;
  });

  let locked = false;
  Quagga.onDetected(async (data)=>{
    if(locked) return;
    const code = data && data.codeResult && data.codeResult.code;
    if(!code || !/^97[89]\d{10}$/.test(code)) return; // valida solo ISBN-13 (prefisso 978/979)
    locked = true;
    Quagga.stop();
    statusEl.innerHTML = `<div class="status-line ok">Codice rilevato: ${code}. Cerco il volume…</div>`;
    resultEl.innerHTML = '';
    const book = await lookupIsbn(code);
    if(!book){
      resultEl.innerHTML = `
        <div class="status-line err">ISBN non trovato nel database libri.</div>
        <label>Titolo (inserisci manualmente)</label>
        <input type="text" id="bc-title" placeholder="es. One Piece Vol. 12">
        <label>Editore (edizione) — opzionale</label>
        <input type="text" id="bc-publisher" placeholder="es. Star Comics">
        <div class="cam-actions"><button class="btn primary" id="bc-retry">Riprova scansione</button><button class="btn" id="bc-manual">Cerca con questo titolo</button></div>`;
      resultEl.querySelector('#bc-retry').addEventListener('click', ()=> renderBarcode());
      resultEl.querySelector('#bc-manual').addEventListener('click', async ()=>{
        const t = resultEl.querySelector('#bc-title').value.trim();
        if(!t) return;
        const vol = extractVolumeNumber(t);
        const title = t.replace(/vol(?:ume)?\.?\s*\d{1,3}/i,'').trim();
        const publisher = resultEl.querySelector('#bc-publisher').value.trim() || null;
        await runSeriesSearch(resultEl, title||t, vol, publisher, 'barcode');
      });
      return;
    }
    const guessedVol = extractVolumeNumber(book.title);
    const cleanTitle = book.title.replace(/[,:\-]?\s*vol(?:ume)?\.?\s*\d{1,3}.*$/i,'').trim();
    resultEl.innerHTML = `
      <div class="status-line ok">Trovato: ${escapeHtml(book.title)}</div>
      <label>Titolo serie</label>
      <input type="text" id="f-title" value="${escapeHtml(cleanTitle||book.title)}">
      <label>Numero volume</label>
      <input type="number" id="f-vol" min="1" max="999" value="${guessedVol||''}">
      <label>Editore (edizione) — rilevato dal codice ISBN, modificabile</label>
      <input type="text" id="f-publisher" value="${escapeHtml(book.publisher||'')}" placeholder="es. Star Comics">
      <div class="cam-actions"><button class="btn primary" id="f-search">Cerca la serie</button></div>
      <div id="f-candidates"></div>
    `;
    resultEl.querySelector('#f-search').addEventListener('click', async ()=>{
      const title = resultEl.querySelector('#f-title').value.trim();
      const vol = parseInt(resultEl.querySelector('#f-vol').value,10) || null;
      const publisher = resultEl.querySelector('#f-publisher').value.trim() || null;
      await runSeriesSearch(resultEl.querySelector('#f-candidates'), title, vol, publisher, 'barcode');
    });
  });
}

/* ===================== MANUAL VIEW ===================== */
function renderManual(){
  root.innerHTML = `
    <div class="panel">
      <p class="hint">Cerca una serie per titolo e segna i volumi che possiedi, senza fotocamera.</p>
      <label>Titolo serie</label>
      <input type="text" id="m-title" placeholder="es. Jujutsu Kaisen">
      <label>Editore (edizione) — opzionale</label>
      <input type="text" id="m-publisher" placeholder="es. Star Comics">
      <div class="cam-actions"><button class="btn primary" id="m-search">Cerca</button></div>
      <div id="m-candidates"></div>
    </div>
  `;
  const input = document.getElementById('m-title');
  const pubInput = document.getElementById('m-publisher');
  const go = async ()=>{
    const t = input.value.trim();
    if(!t) return;
    const publisher = pubInput.value.trim() || null;
    await runSeriesSearch(document.getElementById('m-candidates'), t, null, publisher, 'manuale');
  };
  document.getElementById('m-search').addEventListener('click', go);
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') go(); });
}

/* ===================== INIT ===================== */
(async function init(){
  LIB = await loadLibrary();
  render();
})();

})();
</script>
